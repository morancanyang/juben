server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_buffering off; proxy_read_timeout 60s; }
  location /health { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
